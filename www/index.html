<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1220">
<title>Glow Tasks</title>
<style>
  :root{
    --bg:#0f1220; --card:#181c30; --text:#eceefb; --muted:#8a90b2; --line:#262b47;
    --pending:#ff4d5e; --ongoing:#ffc933; --done:#35e08a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;padding:max(28px,env(safe-area-inset-top)) 16px 40px}
  main{max-width:560px;margin:0 auto}
  h1{font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .add{display:flex;gap:8px;margin-bottom:14px}
  .add input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:14px;font-size:16px;outline:none}
  .add input:focus{border-color:#5b63a8}
  .add button{background:#5b63ff;color:#fff;border:0;border-radius:12px;padding:0 18px;font-size:16px;font-weight:600}
  .filters{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}
  .filters button{background:transparent;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
  .filters button.on{color:var(--text);border-color:#5b63a8;background:#1e2342}
  ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  li{--c:var(--pending);display:flex;align-items:center;gap:12px;background:var(--card);
    border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:14px;padding:12px 12px 12px 14px;
    box-shadow:0 0 16px -2px color-mix(in srgb,var(--c) 60%,transparent), inset 0 0 22px -14px var(--c);
    transition:box-shadow .25s,border-color .25s}
  li.ongoing{--c:var(--ongoing)}
  li.done{--c:var(--done)}
  .dot{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--c);
    box-shadow:0 0 10px 2px var(--c),0 0 22px 4px color-mix(in srgb,var(--c) 55%,transparent);
    transition:background .2s,box-shadow .2s}
  .body{flex:1;min-width:0}
  .text{font-size:16px;line-height:1.35;word-break:break-word}
  li.done .text{color:var(--muted);text-decoration:line-through}
  .state{font-size:12px;color:var(--c);margin-top:2px}
  .edit{width:100%;background:#0f1220;border:1px solid #5b63a8;color:var(--text);
    border-radius:8px;padding:8px;font-size:16px;outline:none}
  .icons{display:flex;gap:2px}
  .icons button{background:none;border:0;color:var(--muted);font-size:18px;padding:8px;border-radius:8px}
  .icons button:active{background:#262b47}
  .empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:15px}
  button:focus-visible,input:focus-visible{outline:2px solid #8f96ff;outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Glow Tasks</h1>
  <p class="sub">Tap the glowing light to change status.</p>
  <div class="add">
    <input id="newText" type="text" placeholder="Add a task" enterkeyhint="done" autocomplete="off">
    <button id="addBtn">Add</button>
  </div>
  <div class="filters" id="filters"></div>
  <ul id="list"></ul>
</main>
<script>
(function(){
  var KEY="glow-tasks-v1";
  var STATES=["pending","ongoing","done"];
  var LABEL={pending:"Pending",ongoing:"Ongoing",done:"Completed"};
  var tasks=[], filter="all", editingId=null;

  try{ tasks=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ tasks=[]; }
  if(!Array.isArray(tasks)) tasks=[];

  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(tasks)); }catch(e){} }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

  var list=document.getElementById("list");
  var input=document.getElementById("newText");

  function add(){
    var t=input.value.trim();
    if(!t) return;
    tasks.unshift({id:uid(),text:t,status:"pending"});
    input.value="";
    save(); render();
  }
  document.getElementById("addBtn").onclick=add;
  input.addEventListener("keydown",function(e){ if(e.key==="Enter") add(); });

  function renderFilters(){
    var box=document.getElementById("filters");
    box.innerHTML="";
    ["all"].concat(STATES).forEach(function(f){
      var n=f==="all"?tasks.length:tasks.filter(function(t){return t.status===f}).length;
      var b=document.createElement("button");
      b.textContent=(f==="all"?"All":LABEL[f])+" "+n;
      if(f===filter) b.className="on";
      b.onclick=function(){ filter=f; render(); };
      box.appendChild(b);
    });
  }

  function commitEdit(task,value){
    var v=value.trim();
    if(v) task.text=v;
    editingId=null; save(); render();
  }

  function render(){
    renderFilters();
    list.innerHTML="";
    var shown=tasks.filter(function(t){return filter==="all"||t.status===filter});
    if(!shown.length){
      var e=document.createElement("div");
      e.className="empty";
      e.textContent=tasks.length?"No tasks with this status.":"No tasks yet. Add your first one above.";
      list.appendChild(e); return;
    }
    shown.forEach(function(task){
      var li=document.createElement("li");
      li.className=task.status;

      var dot=document.createElement("button");
      dot.className="dot";
      dot.setAttribute("aria-label","Status: "+LABEL[task.status]+". Tap to change.");
      dot.onclick=function(){
        task.status=STATES[(STATES.indexOf(task.status)+1)%3];
        save(); render();
      };

      var body=document.createElement("div");
      body.className="body";
      if(editingId===task.id){
        var inp=document.createElement("input");
        inp.className="edit"; inp.value=task.text; inp.enterKeyHint="done";
        inp.addEventListener("keydown",function(e){
          if(e.key==="Enter") commitEdit(task,inp.value);
          if(e.key==="Escape"){ editingId=null; render(); }
        });
        inp.addEventListener("blur",function(){ if(editingId===task.id) commitEdit(task,inp.value); });
        body.appendChild(inp);
        setTimeout(function(){ inp.focus(); inp.select(); },0);
      }else{
        var tx=document.createElement("div");
        tx.className="text"; tx.textContent=task.text;
        tx.onclick=function(){ editingId=task.id; render(); };
        var st=document.createElement("div");
        st.className="state"; st.textContent=LABEL[task.status];
        body.appendChild(tx); body.appendChild(st);
      }

      var icons=document.createElement("div");
      icons.className="icons";
      var ed=document.createElement("button");
      ed.textContent="\u270E"; ed.setAttribute("aria-label","Edit task");
      ed.onmousedown=function(e){ e.preventDefault(); };
      ed.onclick=function(){ editingId=task.id; render(); };
      var del=document.createElement("button");
      del.textContent="\u2715"; del.setAttribute("aria-label","Delete task");
      del.onmousedown=function(e){ e.preventDefault(); };
      del.onclick=function(){
        tasks=tasks.filter(function(t){return t.id!==task.id});
        editingId=null; save(); render();
      };
      icons.appendChild(ed); icons.appendChild(del);

      li.appendChild(dot); li.appendChild(body); li.appendChild(icons);
      list.appendChild(li);
    });
  }
  render();
})();
</script>
</body>
</html>
